<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Mi Web{% endblock %}</title>


    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Lobster&family=Monsieur+La+Doulaise&family=Noto+Sans+Warang+Citi&family=Trispace:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>

    {% block hero %}
    <div class="container">
        <h1>Mini practica para organizar tus uñas en casa 💅💫</h1>
        <h2>¡Elige lo que quieres aprender!</h2>
        <nav class="barra">
            <a href="/materiales"><button class="button_nav">Materiales</button></a>
            <a href="/salubridad"><button class="button_nav">Salubridad</button></a>
            <a href="/tecnicas"><button class="button_nav">Tecnicas</button></a>
        </nav>
        <img src="{{ url_for('static', path='imagenes/unas.webp') }}" alt="uñas">
    </div>
    {% endblock %}
    
    <main>
        {% block contenido %}{% endblock %}
    </main>
    
    <footer>
    © {{ ano_actual }} — Hecho con FastAPI + Jinja2 - by ElizabethDGiraldo
</footer>

</body>
</html>
